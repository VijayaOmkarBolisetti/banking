<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B5BDB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CreditFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint so dark-mode users never see
      // a white flash. Mirrors applyTheme() in src/store/useThemeStore.ts.
      (function () {
        var mode = 'light'
        try {
          var saved = JSON.parse(localStorage.getItem('creditflow-theme') || '{}').state || {}
          // Light and dark only — always stamp one, matching useThemeStore.
          if (saved.mode === 'dark') mode = 'dark'
          if (saved.accent) {
            document.documentElement.style.setProperty('--c-accent', saved.accent)
          }
        } catch (e) {
          /* first visit, or storage blocked — fall back to light */
        }
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
